<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Admin</title>
    <meta name="description" content="Admin Dashboard UI built with Shadcn and Vite." />
    <!-- 站点设置由后端注入到 window.settings -->
    <script src="/settings.js"></script>
    <script src="/settings.local.js"></script>
    <!-- 首屏应用主题，避免 zustand rehydrate 前闪白 -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("fboard-admin-settings");
          var theme = "light";
          var sidebarTheme = "light";
          if (raw) {
            var parsed = JSON.parse(raw);
            var state = parsed && parsed.state ? parsed.state : parsed;
            if (state) {
              if (state.theme) theme = state.theme;
              if (state.sidebarTheme) sidebarTheme = state.sidebarTheme;
            }
          }
          var isDark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.classList.toggle(
            "sidebar-dark",
            sidebarTheme === "dark"
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
